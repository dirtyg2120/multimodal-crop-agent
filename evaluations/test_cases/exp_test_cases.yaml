test_cases:
  # DISEASE SEVERITY TESTS (High, Medium, Low)

  - id: TC001
    name: "High Disease Severity + Harmful Pest"
    description: "Tests high severity detection and chemical recommendation"
    deps:
      crop_name: "Tomato"
      total_leaves: 7
      healthy_count: 1
      disease_counts:
        "Early blight": 6
      pest_counts:
        "Aphid": 4
    ground_truth:
      severity_level: "High"
      overall_health_status: "Severe Infestation"
      should_have_pesticides: true
      should_mention_disease: "Early blight"
      should_mention_pest: "Aphid"
      infection_ratio_range: [0.80, 0.90]

  - id: TC002
    name: "Medium Disease Severity"
    description: "Tests medium severity with organic treatment recommendation"
    deps:
      crop_name: "Tomato"
      total_leaves: 8
      healthy_count: 5
      disease_counts:
        "Septoria leaf spot": 3
      pest_counts: {}
    ground_truth:
      severity_level: "Medium"
      infection_ratio_range: [0.30, 0.45]
      should_mention_disease: "Septoria leaf spot"

  - id: TC003
    name: "Low Disease Severity"
    description: "Tests low severity with preventive measures"
    deps:
      crop_name: "Tomato"
      total_leaves: 10
      healthy_count: 9
      disease_counts:
        "Leaf Mold": 1
      pest_counts: {}
    ground_truth:
      severity_level: "Low"
      infection_ratio_range: [0.05, 0.15]
      should_have_pesticides: false
      should_mention_disease: "Leaf Mold"

  # PEST CONFLICT RESOLUTION TESTS

  - id: TC004
    name: "Beneficial vs Harmful Conflict"
    description: "Tests conflict resolution - should avoid chemicals to protect beneficial insects"
    deps:
      crop_name: "Tomato"
      total_leaves: 5
      healthy_count: 4
      disease_counts: {}
      pest_counts:
        "Aphid": 3
        "Ladybug": 2
    ground_truth:
      severity_level: "Low"
      should_avoid_chemicals: true
      should_mention_beneficial: "Ladybug"

  - id: TC005
    name: "Only Beneficial Insects"
    description: "Tests protection of beneficial insects"
    deps:
      crop_name: "Tomato"
      total_leaves: 6
      healthy_count: 6
      disease_counts: {}
      pest_counts:
        "Ladybug": 2
        "Bee": 1
    ground_truth:
      severity_level: "Low"
      overall_health_status: "Healthy"
      should_have_pesticides: false
      should_mention_beneficial: "Ladybug"

  - id: TC006
    name: "High Harmful Pest Population"
    description: "Tests chemical recommendation for severe pest infestation"
    deps:
      crop_name: "Tomato"
      total_leaves: 8
      healthy_count: 7
      disease_counts: {}
      pest_counts:
        "Aphid": 12
        "Whitefly": 8
    ground_truth:
      severity_level: "High"
      should_have_pesticides: true
      should_mention_pest: "Aphid"

  # HEALTHY PLANT TESTS

  - id: TC007
    name: "Completely Healthy Plant"
    description: "Tests correct identification of healthy plants"
    deps:
      crop_name: "Tomato"
      total_leaves: 6
      healthy_count: 6
      disease_counts: {}
      pest_counts: {}
    ground_truth:
      severity_level: "Low"
      overall_health_status: "Healthy"
      should_have_pesticides: false
      infection_ratio_range: [0.0, 0.1]

  # COMPLEX MULTI-ISSUE TESTS

  - id: TC008
    name: "Multiple Diseases"
    description: "Tests handling of multiple concurrent diseases"
    deps:
      crop_name: "Tomato"
      total_leaves: 10
      healthy_count: 2
      disease_counts:
        "Early blight": 5
        "Late blight": 3
      pest_counts: {}
    ground_truth:
      severity_level: "High"
      should_mention_disease: ["Early blight", "Late blight"]
      infection_ratio_range: [0.75, 0.85]
      should_have_pesticides: true

  - id: TC009
    name: "Disease + Beneficial + Harmful Pests"
    description: "Tests complex scenario with disease and mixed pests. Disease severity is Medium to avoid chemical force constraints on beneficial safety rule."
    deps:
      crop_name: "Tomato"
      total_leaves: 8
      healthy_count: 5
      disease_counts:
        "Bacterial spot": 3
      pest_counts:
        "Aphid": 4
        "Ladybug": 2
    ground_truth:
      severity_level: "Medium"
      infection_ratio_range: [0.30, 0.45]
      should_mention_disease: "Bacterial spot"
      should_avoid_chemicals: true  # Ladybug presence blocks chemical use
      should_mention_beneficial: "Ladybug"

  - id: TC010
    name: "Low Disease + High Pest"
    description: "Tests prioritization when disease is low but pests are high"
    deps:
      crop_name: "Tomato"
      total_leaves: 10
      healthy_count: 8
      disease_counts:
        "Leaf Mold": 2
      pest_counts:
        "Aphid": 15
    ground_truth:
      severity_level: "Medium"  # Low disease but high pest pressure elevates severity
      should_have_pesticides: true
      should_mention_pest: "Aphid"

  # EDGE CASES

  - id: TC011
    name: "Borderline Medium-High Severity"
    description: "Tests boundary between medium and high severity"
    deps:
      crop_name: "Tomato"
      total_leaves: 10
      healthy_count: 5
      disease_counts:
        "Early blight": 5
      pest_counts: {}
    ground_truth:
      severity_level: "Medium"  # Exactly 50%
      infection_ratio_range: [0.45, 0.55]

  - id: TC012
    name: "Corn Common Rust - Crop Diversity"
    description: "Tests agent on Corn crop with rust disease; validates RAG retrieval for Corn"
    deps:
      crop_name: "Corn"
      total_leaves: 9
      healthy_count: 5
      disease_counts:
        "Common rust": 4
    ground_truth:
      severity_level: "Medium"
      infection_ratio_range: [0.40, 0.50]
      should_mention_disease: "Common rust"

  # DIFFERENT CROP TESTS

  - id: TC013
    name: "Durian Leaf Blight"
    description: "Tests RAG retrieval for Durian crop. ACIAR Monograph 114 covers Phytophthora management with dithiocarbamates (mancozeb) and systemic fungicides (metalaxyl, fosetyl-al)."
    deps:
      crop_name: "Durian"
      total_leaves: 8
      healthy_count: 3
      disease_counts:
        "Leaf Blight": 5
      pest_counts: {}
    ground_truth:
      severity_level: "High"
      should_mention_disease: "Leaf Blight"
      infection_ratio_range: [0.60, 0.70]
      should_have_pesticides: true
      should_mention_specific_treatment: ["mancozeb", "metalaxyl", "fosetyl-al"]

  - id: TC014
    name: "Durian with Beneficial Insects"
    description: "Tests crop-specific pest handling"
    deps:
      crop_name: "Durian"
      total_leaves: 6
      healthy_count: 5
      disease_counts: {}
      pest_counts:
        "Bee": 3
    ground_truth:
      overall_health_status: "Healthy"
      should_have_pesticides: false
      should_mention_beneficial: "Bee"

  - id: TC015
    name: "Corn Northern Leaf Blight + Aphid"
    description: "Tests non-Tomato pest conflict on Corn; validates RAG retrieval for Corn diseases"
    deps:
      crop_name: "Corn"
      total_leaves: 9
      healthy_count: 3
      disease_counts:
        "Northern Leaf Blight": 6
      pest_counts:
        "Aphid": 5
    ground_truth:
      severity_level: "High"
      infection_ratio_range: [0.60, 0.75]
      should_mention_disease: "Northern Leaf Blight"
      should_mention_pest: "Aphid"
      should_have_pesticides: true

  # RAG VALIDATION TEST

  - id: TC016
    name: "Grape Multi-Disease - RAG Retrieval Test"
    description: "Tests RAG retrieval for Grape with two concurrent fungal diseases. The Grape PDF covers copper hydroxide and lime sulfur."
    deps:
      crop_name: "Grape"
      total_leaves: 10
      healthy_count: 3
      disease_counts:
        "Esca (Black Measles)": 4
        "Leaf blight (Isariopsis Leaf Spot)": 3
      pest_counts: {}
    ground_truth:
      severity_level: "High"
      infection_ratio_range: [0.65, 0.75]
      should_mention_disease: ["Esca (Black Measles)", "Leaf blight (Isariopsis Leaf Spot)"]
      should_have_pesticides: true
      should_mention_specific_treatment: ["copper hydroxide", "lime sulfur"]

  # VALIDATOR TRIGGER TEST

  - id: TC017
    name: "Validator Trigger - Beneficial Insect Blocks Pesticide"
    description: "Low disease + mixed pests. Bee presence should block chemical recommendations even though Whitefly would normally trigger them."
    deps:
      crop_name: "Tomato"
      total_leaves: 12
      healthy_count: 10
      disease_counts:
        "Septoria leaf spot": 2
      pest_counts:
        "Bee": 3
        "Whitefly": 2
    ground_truth:
      severity_level: "Low"
      should_have_pesticides: false
      should_avoid_chemicals: true
      should_mention_beneficial: "Bee"

  # ADDITIONAL NEW TEST CASES (TC018 - TC030)

  - id: TC018
    name: "Corn Common Rust + Beneficial Insect"
    description: "Tests beneficial insect protection protocol on Corn."
    deps:
      crop_name: "Corn"
      total_leaves: 10
      healthy_count: 9
      disease_counts:
        "Common rust": 1
      pest_counts:
        "Ladybug": 2
        "Aphid": 3
    ground_truth:
      severity_level: "Low"
      should_avoid_chemicals: true
      should_mention_beneficial: "Ladybug"
      should_mention_disease: "Common rust"

  - id: TC019
    name: "Durian Leaf Blight - RAG High Severity"
    description: "Tests treatment specifications for Leaf Blight on Durian."
    deps:
      crop_name: "Durian"
      total_leaves: 6
      healthy_count: 2
      disease_counts:
        "Leaf Blight": 4
      pest_counts: {}
    ground_truth:
      severity_level: "High"
      should_have_pesticides: true
      should_mention_specific_treatment: ["phosphonate", "metalaxyl", "mancozeb"]
      should_mention_disease: "Leaf Blight"

  - id: TC020
    name: "Grape Leaf Blight - RAG Organic"
    description: "Tests Leaf blight (Isariopsis Leaf Spot) copper-based management recommendation."
    deps:
      crop_name: "Grape"
      total_leaves: 10
      healthy_count: 7
      disease_counts:
        "Leaf blight (Isariopsis Leaf Spot)": 3
      pest_counts: {}
    ground_truth:
      severity_level: "Medium"
      should_mention_specific_treatment: ["copper", "sulfur"]
      should_mention_disease: "Leaf blight (Isariopsis Leaf Spot)"

  - id: TC021
    name: "Grape Black rot - RAG Organic"
    description: "Tests Black rot organic fungicide recommendation from grape manual."
    deps:
      crop_name: "Grape"
      total_leaves: 10
      healthy_count: 6
      disease_counts:
        "Black rot": 4
      pest_counts: {}
    ground_truth:
      severity_level: "Medium"
      should_mention_specific_treatment: ["copper", "lime"]
      should_mention_disease: "Black rot"

  - id: TC022
    name: "Tomato Bacterial Spot - RAG Copper"
    description: "Tests copper bactericide treatment recommendations for Tomato Bacterial Spot."
    deps:
      crop_name: "Tomato"
      total_leaves: 7
      healthy_count: 3
      disease_counts:
        "Bacterial spot": 4
      pest_counts: {}
    ground_truth:
      severity_level: "High"
      should_have_pesticides: true
      should_mention_specific_treatment: ["copper"]
      should_mention_disease: "Bacterial spot"

  - id: TC023
    name: "Grape Black rot - RAG Organic & Cultural"
    description: "Tests Black rot sanitation (mummy) and chemical control (copper/lime sulfur)."
    deps:
      crop_name: "Grape"
      total_leaves: 10
      healthy_count: 5
      disease_counts:
        "Black rot": 5
      pest_counts: {}
    ground_truth:
      severity_level: "Medium"
      should_mention_specific_treatment: ["copper", "mumm"]
      should_mention_disease: "Black rot"

  - id: TC024
    name: "Corn Northern Leaf Blight - RAG Cultural"
    description: "Tests Northern Leaf Blight management recommendations (rotation, tillage, hybrid)."
    deps:
      crop_name: "Corn"
      total_leaves: 8
      healthy_count: 2
      disease_counts:
        "Northern Leaf Blight": 6
      pest_counts: {}
    ground_truth:
      severity_level: "High"
      should_have_pesticides: true
      should_mention_specific_treatment: ["rotation", "hybrid"]
      should_mention_disease: "Northern Leaf Blight"

  - id: TC025
    name: "Durian Leaf Blight - RAG Low Severity"
    description: "Tests seedling Leaf Blight nursery suppression recommendations."
    deps:
      crop_name: "Durian"
      total_leaves: 10
      healthy_count: 9
      disease_counts:
        "Leaf Blight": 1
      pest_counts: {}
    ground_truth:
      severity_level: "Low"
      should_mention_specific_treatment: ["nursery", "phosphonate"]
      should_mention_disease: "Leaf Blight"

  - id: TC026
    name: "Tomato Leaf Mold - RAG Cultural/Fungicide"
    description: "Tests air circulation and spacing recommendations for Leaf Mold."
    deps:
      crop_name: "Tomato"
      total_leaves: 10
      healthy_count: 6
      disease_counts:
        "Leaf Mold": 4
      pest_counts: {}
    ground_truth:
      severity_level: "Medium"
      should_mention_specific_treatment: ["circulation", "spacing"]
      should_mention_disease: "Leaf Mold"

  - id: TC027
    name: "Durian Leaf Blight with Beneficials"
    description: "Tests beneficial insect protection alongside leaf blight."
    deps:
      crop_name: "Durian"
      total_leaves: 10
      healthy_count: 9
      disease_counts:
        "Leaf Blight": 1
      pest_counts:
        "Dragonfly": 1
    ground_truth:
      severity_level: "Low"
      should_have_pesticides: false
      should_avoid_chemicals: true
      should_mention_beneficial: "Dragonfly"
      should_mention_disease: "Leaf Blight"

  - id: TC028
    name: "Grape with Mixed Beneficials and Harmful Pests"
    description: "Tests mixed pests on grape; beneficials should block pesticide."
    deps:
      crop_name: "Grape"
      total_leaves: 10
      healthy_count: 10
      disease_counts: {}
      pest_counts:
        "Spider Mites": 5
        "Wasp": 2
        "Spider": 1
    ground_truth:
      severity_level: "Low"
      should_have_pesticides: false
      should_avoid_chemicals: true
      should_mention_beneficial: ["Spider", "Wasp"]

  - id: TC029
    name: "Corn Northern Leaf Blight - Seed Treatment"
    description: "Tests treatment recommendations for Corn leaf blight."
    deps:
      crop_name: "Corn"
      total_leaves: 10
      healthy_count: 7
      disease_counts:
        "Northern Leaf Blight": 3
      pest_counts: {}
    ground_truth:
      severity_level: "Medium"
      should_mention_specific_treatment: ["rotation", "hybrid"]
      should_mention_disease: "Northern Leaf Blight"

  - id: TC030
    name: "Tomato Early Blight + Septoria + Aphid"
    description: "Tests complex co-infection and insect infestation."
    deps:
      crop_name: "Tomato"
      total_leaves: 10
      healthy_count: 4
      disease_counts:
        "Early blight": 4
        "Septoria leaf spot": 2
      pest_counts:
        "Aphid": 5
    ground_truth:
      severity_level: "High"
      should_have_pesticides: true
      should_mention_disease: ["Early blight", "Septoria leaf spot"]
      should_mention_pest: "Aphid"
